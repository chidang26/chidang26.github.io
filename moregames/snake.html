<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="../script.js" defer></script>
  <script src="../theme.js" defer></script>
  <title>Tic Tac Toe</title>
  <!-- redeploy-trigger: 2026-08-18T00:00:00Z - trigger: redeploy pages -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9930877452644358"
    crossorigin="anonymous"></script>
<script src="//code.tidio.co/25ia7eccd3tb8k3ymphv3apw3pivqsuf.js" async></script>
</head>


<body>
    <button id="themeToggle" class="theme-btn">🌙 Giao diện Tối</button>
    <a href="../index.html" class="back-btn">⬅ Quay lại Trang chủ</a>
    <h1>Rắn Săn Mồi 🐍</h1>
    <div id="score">Điểm: 0</div>
    <!-- Bảng game -->
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const box = 20; // Kích thước mỗi ô
        let snake = [];
        snake[0] = { x: 10 * box, y: 10 * box }; // Vị trí đầu rắn ban đầu

        // Tạo thức ăn ngẫu nhiên
        let food = {
            x: Math.floor(Math.random() * 20) * box,
            y: Math.floor(Math.random() * 20) * box
        };
        let score = 0;
        let d; // Hướng di chuyển

        // Lắng nghe phím mũi tên
        document.addEventListener("keydown", direction);
        function direction(event) {
            if(event.keyCode == 37 && d != "RIGHT") d = "LEFT";
            else if(event.keyCode == 38 && d != "DOWN") d = "UP";
            else if(event.keyCode == 39 && d != "LEFT") d = "RIGHT";
            else if(event.keyCode == 40 && d != "UP") d = "DOWN";
        }

        // Vẽ game
        function draw() {
            ctx.fillStyle = "#333";
            ctx.fillRect(0, 0, 400, 400);

            for(let i = 0; i < snake.length; i++) {
                ctx.fillStyle = (i == 0) ? "#2ed573" : "white";
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
                ctx.strokeStyle = "#333";
                ctx.strokeRect(snake[i].x, snake[i].y, box, box);
            }

            ctx.fillStyle = "red";
            ctx.fillRect(food.x, food.y, box, box);

            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if(d == "LEFT") snakeX -= box;
            if(d == "UP") snakeY -= box;
            if(d == "RIGHT") snakeX += box;
            if(d == "DOWN") snakeY += box;

            // Rắn ăn mồi
            if(snakeX == food.x && snakeY == food.y) {
                score++;
                document.getElementById("score").innerText = "Điểm: " + score;
                food = {
                    x: Math.floor(Math.random() * 20) * box,
                    y: Math.floor(Math.random() * 20) * box
                };
            } else {
                snake.pop(); // Cắt đuôi nếu không ăn mồi
            }

            let newHead = { x: snakeX, y: snakeY };

            // Game over
            if(snakeX < 0 || snakeY < 0 || snakeX >= 400 || snakeY >= 400 || collision(newHead, snake)) {
                clearInterval(game);
                alert("Thua rồi! Điểm của bạn là: " + score);
                location.reload(); // Chơi lại
            }

            snake.unshift(newHead); // Thêm đầu mới
        }

        function collision(head, array) {
            for(let i = 0; i < array.length; i++) {
                if(head.x == array[i].x && head.y == array[i].y) return true;
            }
            return false;
        }

        let game = setInterval(draw, 100); // Tốc độ rắn chạy
    </script>
</body>
</html>
